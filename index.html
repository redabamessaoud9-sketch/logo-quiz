<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo Quiz Master - Édition Violette</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* --- NOUVEAU : LOADING SCREEN --- */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #05050d;
            background-image: url("ChatGPT Image 13 août 2026, 21_49_01.png");
            background-size: cover;
            display: flex; align-items: center; justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .loading-content { text-align: center; width: 80%; max-width: 400px; }
        .loading-content h1 { margin-bottom: 20px; font-size: 2.5rem; }
        
        .loading-bar {
            width: 100%; height: 12px;
            background: rgba(255,255,255,0.12);
            border-radius: 6px; overflow: hidden;
            border: 1px solid var(--primary-light);
            margin: 15px 0;
        }
        #loading-progress {
            width: 0%; height: 100%;
            background: linear-gradient(90deg, #8B5CFF, #B56CFF);
            box-shadow: 0 0 15px #8B5CFF, 0 0 25px rgba(181, 108, 255, 0.7);
            transition: width 0.1s linear;
        }
        #loading-percent { font-family: 'Orbitron', sans-serif; color: var(--text-main); font-size: 1.2rem; }
        /* -------------------------------- */

        :root {
            --primary: #8B5CFF; --primary-light: #B56CFF;
            --primary-hover-1: #A56BFF; --primary-hover-2: #C58AFF;
            --primary-border: #D5B8FF; --primary-glow: rgba(139, 92, 255, 0.55);
            --primary-glow-hover: rgba(181, 108, 255, 0.8);
            --secondary: #3B167D; --accent: #FFD21F;
            --bg-dark: #05050d; --text-main: #FFFFFF;
            --text-muted: #E9D7FF; --text-level: #D8B4FF;
            --success: #FFD21F; --error: #ff3366;   
        }

        /* ... (Reste de ton CSS précédent inchangé) ... */
        body { font-family: 'Rajdhani', sans-serif; background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .hidden { display: none !important; }
        .fade-out { opacity: 0; pointer-events: none; }
        /* ... */
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-content">
            <h1>LOGO QUIZ</h1>
            <div class="loading-bar">
                <div id="loading-progress"></div>
            </div>
            <div id="loading-percent">0%</div>
            <p style="color: var(--text-muted);">Chargement...</p>
        </div>
    </div>

    <!-- Interface principale -->
    <div id="app-container" class="hidden">
       <!-- Ton contenu de jeu habituel -->
    </div>

    <script>
        // Fonction pour lancer le chargement au démarrage
        function initLoading() {
            let progress = 0;
            const progressBar = document.getElementById("loading-progress");
            const progressText = document.getElementById("loading-percent");
            const loadingScreen = document.getElementById("loading-screen");
            const appContainer = document.getElementById("app-container");

            const interval = setInterval(() => {
                progress += 2; // Progression fluide sur ~2.5s
                progressBar.style.width = progress + "%";
                progressText.textContent = progress + "%";

                if (progress >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        loadingScreen.classList.add('fade-out');
                        appContainer.classList.remove('hidden');
                        setTimeout(() => loadingScreen.classList.add('hidden'), 500);
                    }, 300);
                }
            }, 50);
        }

        // Lancement au chargement du DOM
        window.addEventListener('DOMContentLoaded', () => {
            initLoading();
        });

        // ... (Ton code JavaScript existant pour le jeu) ...
    </script>
</body>
</html>

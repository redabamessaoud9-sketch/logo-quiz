<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo Quiz Master - Édition Violette</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            /* Nouvelle palette Violette */
            --primary: #8B5CFF;        
            --primary-light: #B56CFF;
            --primary-hover-1: #A56BFF;
            --primary-hover-2: #C58AFF;
            --primary-border: #D5B8FF;
            
            /* Lueurs (Glow) */
            --primary-glow: rgba(139, 92, 255, 0.55);
            --primary-glow-hover: rgba(181, 108, 255, 0.8);
            
            --secondary: #3B167D;
            --accent: #FFD21F; /* Or pour les récompenses et succès */
            
            --bg-dark: #05050d;        
            --panel-bg: transparent; 
            
            /* Textes */
            --text-main: #FFFFFF;
            --text-muted: #E9D7FF;
            --text-level: #D8B4FF;
            
            --success: #FFD21F; /* Succès en or/jaune */
            --error: #ff3366;   
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-dark);
            background-image: url("ChatGPT Image 13 août 2026, 21_49_01.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            background: transparent;
            width: 90%;
            max-width: 600px;
            padding: 40px;
            position: relative;
            z-index: 2;
            text-align: center;
        }

        /* Titres avec texte blanc et lueur violette */
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 2.8rem;
            letter-spacing: 2px;
            color: var(--text-main);
            margin-bottom: 10px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(139, 92, 255, 0.7);
        }

        h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            color: var(--text-main);
            margin-bottom: 20px;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(139, 92, 255, 0.6);
        }

        p.subtitle { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 30px; }

        /* BOUTONS PRINCIPAUX */
        .btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: var(--text-main);
            border: 1px solid var(--primary-border);
            padding: 14px 28px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 900;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 0 18px var(--primary-glow);
            width: 100%;
            margin-bottom: 15px;
        }

        .btn:hover {
            background: linear-gradient(135deg, var(--primary-hover-1), var(--primary-hover-2));
            box-shadow: 0 0 28px var(--primary-glow-hover);
            transform: translateY(-2px);
            color: var(--text-main);
        }

        .btn:disabled {
            background: rgba(139, 92, 255, 0.1);
            border-color: rgba(139, 92, 255, 0.2);
            color: rgba(255, 255, 255, 0.4);
            cursor: not-allowed;
            box-shadow: none;
            transform: none !important;
        }

        /* BOUTONS SECONDAIRES */
        .btn-secondary {
            background: rgba(139, 92, 255, 0.08);
            border: 1px solid rgba(139, 92, 255, 0.3);
            color: var(--text-main);
            box-shadow: none;
            margin-bottom: 0;
            width: auto;
        }

        .btn-secondary:hover {
            background: rgba(139, 92, 255, 0.25);
            border-color: var(--primary-light);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        /* Grille des Stages */
        .stages-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 30px;
            max-height: 350px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .stages-grid::-webkit-scrollbar { width: 6px; }
        .stages-grid::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
        .stages-grid::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 3px; }

        .stage-card {
            background: rgba(139, 92, 255, 0.05);
            border: 1px solid rgba(139, 92, 255, 0.15);
            border-radius: 12px;
            padding: 15px 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .stage-card .stage-num {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-level);
        }

        .stage-card.unlocked {
            border-color: rgba(139, 92, 255, 0.5);
            background: rgba(139, 92, 255, 0.15);
        }
        
        .stage-card.unlocked:hover {
            border-color: var(--primary-light);
            transform: scale(1.05);
            box-shadow: 0 5px 20px var(--primary-glow);
        }
        
        .stage-card.completed {
            border-color: var(--accent); /* Bordure or pour complété */
            background: rgba(255, 210, 31, 0.1); /* Fond légèrement or */
        }
        
        .stage-card.completed .stage-num { color: var(--accent); text-shadow: 0 0 8px rgba(255, 210, 31, 0.4); }
        .stage-card.completed i { color: var(--accent); text-shadow: 0 0 8px rgba(255, 210, 31, 0.4); }
        
        .stage-card.locked { opacity: 0.4; cursor: not-allowed; }
        .stage-card.locked .stage-num { color: rgba(233, 215, 255, 0.5); }

        /* Zone d'affichage du Logo */
        .logo-frame {
            background: white;
            border-radius: 20px;
            padding: 20px;
            width: 220px;
            height: 220px;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1), 0 10px 25px rgba(59, 22, 125, 0.5); /* Ombre violet foncé */
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }
        .logo-frame img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .input-group { margin-bottom: 25px; width: 100%; }
        .input-bar {
            width: 100%;
            background: rgba(13, 12, 28, 0.8);
            border: 2px solid rgba(139, 92, 255, 0.3);
            border-radius: 14px;
            padding: 16px 24px;
            font-size: 1.2rem;
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .input-bar:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 20px var(--primary-glow);
        }
        
        .input-bar::placeholder { color: rgba(233, 215, 255, 0.4); }

        .attempts-container {
            display: flex; justify-content: center; gap: 12px; margin-bottom: 20px;
        }
        .heart-icon {
            font-size: 1.6rem; color: var(--primary-light); text-shadow: 0 0 10px var(--primary-glow);
            transition: all 0.3s ease;
        }
        .heart-icon.lost { color: rgba(139, 92, 255, 0.2); text-shadow: none; transform: scale(0.8); }

        #feedback { font-size: 1.1rem; font-weight: 700; min-height: 28px; margin-bottom: 15px; text-transform: uppercase; }

        .music-control {
            position: absolute; top: 20px; right: 20px;
            background: rgba(139, 92, 255, 0.1); border: 1px solid rgba(139, 92, 255, 0.3);
            color: var(--text-main); width: 44px; height: 44px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: all 0.3s ease; z-index: 10;
        }
        .music-control:hover {
            background: var(--primary); border-color: var(--primary-border); color: var(--text-main);
            box-shadow: 0 0 15px var(--primary-glow); transform: rotate(15deg);
        }

        .hidden { display: none !important; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        .shake { animation: shake 0.4s ease; border-color: var(--error); box-shadow: 0 0 25px rgba(255, 51, 102, 0.4); }
        
        /* Glow jaune/or pour les réussites */
        .success-glow { border-color: var(--success); box-shadow: 0 0 30px rgba(255, 210, 31, 0.6); }
    </style>
</head>
<body>

    <audio id="bg-music" loop preload="auto">
        <source src="musique.mp3" type="audio/mpeg">
    </audio>

    <button id="music-btn" class="music-control" onclick="toggleMusic()">
        <i class="fa-solid fa-volume-xmark"></i>
    </button>

    <div class="container">
        
        <!-- ÉCRAN : MENU PRINCIPAL -->
        <div id="menu-screen">
            <h1>Logo Quiz</h1>
            <p class="subtitle">Identifiez la marque mystère</p>
            <button class="btn" onclick="showCategories()">
                <i class="fa-solid fa-play"></i> Jouer
            </button>
        </div>

        <!-- ÉCRAN : CATÉGORIES -->
        <div id="category-screen" class="hidden">
            <h2>Catégories</h2>
            <button class="btn" onclick="selectCategory('restaurants')"><i class="fa-solid fa-burger"></i> Restaurants</button>
            <button class="btn" onclick="selectCategory('voitures')"><i class="fa-solid fa-car"></i> Voitures</button>
            <button class="btn" onclick="selectCategory('vetements')"><i class="fa-solid fa-shirt"></i> Vêtements</button>
            <button class="btn" onclick="selectCategory('équipe')"><i class="fa-solid fa-futbol"></i> équipe</button>
            <button class="btn" onclick="selectCategory('pays')"><i class="fa-solid fa-globe-americas"></i> pays</button>
            <button class="btn btn-secondary" onclick="showMenu()" style="margin-top: 15px;"><i class="fa-solid fa-arrow-left"></i> Retour</button>
        </div>

        <!-- ÉCRAN : SÉLECTION DE STAGE -->
        <div id="stage-screen" class="hidden">
            <h2 id="stage-title-cat">Niveaux</h2>
            <div class="stages-grid" id="stages-grid"></div>
            <button class="btn btn-secondary" onclick="showCategories()"><i class="fa-solid fa-arrow-left"></i> Catégories</button>
        </div>

        <!-- ÉCRAN : JEU -->
        <div id="game-screen" class="hidden">
            <h2 id="game-stage-title">Niveau X</h2>
            
            <div class="attempts-container" id="attempts-container"></div>

            <div class="logo-frame" id="logo-frame">
                <img id="logo-image" src="" alt="Logo" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/a/ac/No_image_available.svg'">
            </div>

            <div id="feedback"></div>

            <div class="input-group">
                <input type="text" class="input-bar" id="answer-input" placeholder="RÉPONSE..." autocomplete="off">
            </div>

            <div style="display: flex; gap: 15px; justify-content: center;">
                <button class="btn btn-secondary" onclick="showStagesList()"><i class="fa-solid fa-grip"></i></button>
                <button class="btn" style="margin-bottom:0;" id="validate-btn" onclick="checkAnswer()"><i class="fa-solid fa-check"></i> Valider</button>
            </div>
        </div>
    </div>

    <script>

                { stage: 7, logo: "pizza-hut.png", answer: "pizza hut" },
                { stage: 8, logo: "pepsi.png", answer: "pepsi" },
                { stage: 9, logo: "coca-cola.png", answer: "coca cola" },
                { stage: 10, logo: "dunkin-donuts.png", answer: "dunkin donuts" }
            ],
            voitures: [
                { stage: 1, logo: "bmw.png", answer: "bmw" },
                { stage: 2, logo: "mercedes.png", answer: "mercedes" },
                { stage: 3, logo: "toyota.png", answer: "toyota" },
                { stage: 4, logo: "porsche.png", answer: "porsche" },
                { stage: 5, logo: "Volkswagen.png", answer: "volkswagen" },
                { stage: 6, logo: "lamborghini.png", answer: "lamborghini" },
                { stage: 7, logo: "ferrari.png", answer: "ferrari" },
                { stage: 8, logo: "honda.png", answer: "honda" },
                { stage: 9, logo: "ford.png", answer: "ford" },
                { stage: 10, logo: "tesla.png", answer: "tesla" },
                { stage: 11, logo: "audi.png", answer: "audi" },
                { stage: 12, logo: "nissan.png", answer: "nissan" },
                { stage: 13, logo: "peugeot.png", answer: "peugeot" },
                { stage: 14, logo: "suzuki.png", answer: "suzuki" },
                { stage: 15, logo: "kia.png", answer: "kia" },
                { stage: 16, logo: "chevrolet.png", answer: "chevrolet" },
                { stage: 17, logo: "mazda.png", answer: "mazda" },
                { stage: 18, logo: "renault.png", answer: "renault" },
                { stage: 19, logo: "fiat.png", answer: "fiat" },
                { stage: 20, logo: "maserati.png", answer: "maserati" }
            ],
              équipe: [
                { stage: 1, logo: "real-madrid.png", answer: "real madrid" },
                { stage: 2, logo: "fc-barcelona.png", answer: "fc barcelona" },
                { stage: 3, logo: "manchester-united.png", answer: "manchester united" },
                { stage: 4, logo: "liverpool.png", answer: "liverpool" },
                { stage: 5, logo: "manchester-city.png", answer: "manchester city" },
                { stage: 6, logo: "arsenal.png", answer: "arsenal" },
                { stage: 7, logo: "chelsea.png", answer: "chelsea" },
                { stage: 8, logo: "bayern-munich.png", answer: "bayern munich" },
                { stage: 9, logo: "borussia-dortmund.png", answer: "borussia dortmund" },
                { stage: 10, logo: "juventus.png", answer: "juventus" },
                { stage: 11, logo: "ac-milan.png", answer: "ac milan" },
                { stage: 12, logo: "inter-milan.png", answer: "inter milan" },
                { stage: 13, logo: "paris-saint-germain.png", answer: "paris saint germain" },
                { stage: 14, logo: "olympique-de-marseille.png", answer: "olympique de marseille" },
                { stage: 15, logo: "ajax.png", answer: "ajax" },
                { stage: 16, logo: "benfica.png", answer: "benfica" },
                { stage: 17, logo: "galatasaray.png", answer: "galatasaray" },
                { stage: 18, logo: "al-nasser.png", answer: "al nasser" },
                { stage: 19, logo: "al-hilal.png", answer: "al hilal" },
                { stage: 20, logo: "napoli.png", answer: "napoli" }
            ],
              pays: [
                { stage: 1, logo: "espagne.png", answer: "espagne" },
                { stage: 2, logo: "france.png", answer: "france" },
                { stage: 3, logo: "italie.png", answer: "italie" },
                { stage: 4, logo: "allemagne.png", answer: "allemagne" },
                { stage: 5, logo: "brésil.png", answer: "brésil" },
                { stage: 6, logo: "argentine.png", answer: "argentine" },
                { stage: 7, logo: "canada.png", answer: "canada" },
                { stage: 8, logo: "japon.png", answer: "japon" },
                { stage: 9, logo: "chine.png", answer: "chine" },
                { stage: 10, logo: "corée-du-sud.png", answer: "corée du sud" },
                { stage: 11, logo: "mexique.png", answer: "mexique" },
                { stage: 12, logo: "australie.png", answer: "australie" },
                { stage: 13, logo: "suisse.png", answer: "suisse" },
                { stage: 14, logo: "turquie.png", answer: "turquie" },
                { stage: 15, logo: "royaume-uni.png", answer: "royaume-uni" },
                { stage: 16, logo: "états-unis.png", answer: "états-unis" },
                { stage: 17, logo: "inde.png", answer: "inde" },
                { stage: 18, logo: "égypte.png", answer: "égypte" },
                { stage: 19, logo: "angleterre.png", answer: "angleterre" },
                { stage: 20, logo: "maroc.png", answer: "maroc" }
            ],
            vetements: [
                { stage: 1, logo: "nike.png", answer: "nike" },
                { stage: 2, logo: "adidas.png", answer: "adidas" },
                { stage: 3, logo: "puma.png", answer: "puma" },
                { stage: 4, logo: "gucci.png", answer: "gucci" },
                { stage: 5, logo: "polo.png", answer: "polo" },
                { stage: 6, logo: "dior.png", answer: "dior" },
                { stage: 7, logo: "levis.png", answer: "levis" },
                { stage: 8, logo: "the-north-face.png", answer: "the north face" },
                { stage: 9, logo: "under-armour.png", answer: "under armour" },
                { stage: 10, logo: "lacoste.png", answer: "lacoste" },
                { stage: 11, logo: "louis-vuitton.png", answer: "louis vuitton" },
                { stage: 12, logo: "calvin-klein.png", answer: "calvin klein" },
                { stage: 13, logo: "converse.png", answer: "converse" },
                { stage: 14, logo: "jordan.png", answer: "jordan" },
                { stage: 15, logo: "prada.png", answer: "prada" },
                { stage: 16, logo: "balenciaga.png", answer: "balenciaga" },
                { stage: 17, logo: "burberry.png", answer: "burberry" },
                { stage: 18, logo: "chanel.png", answer: "chanel" },
                { stage: 19, logo: "fila.png", answer: "fila" },
                { stage: 20, logo: "reebok.png", answer: "reebok" }
            ]
        };

        let activeCategory = '';
        let currentStageIndex = 0;
        let musicPlaying = false;
        let attemptsLeft = 3;
        let cooldownInterval = null;

        const menuScreen = document.getElementById('menu-screen');
        const categoryScreen = document.getElementById('category-screen');
        const stageScreen = document.getElementById('stage-screen');
        const gameScreen = document.getElementById('game-screen');
        const bgMusic = document.getElementById('bg-music');
        const musicBtn = document.getElementById('music-btn');

        function showMenu() {
            hideAll(); menuScreen.classList.remove('hidden');
        }

        function showCategories() {
            hideAll(); categoryScreen.classList.remove('hidden');
        }

        function hideAll() {
            menuScreen.classList.add('hidden');
            categoryScreen.classList.add('hidden');
            stageScreen.classList.add('hidden');
            gameScreen.classList.add('hidden');
        }

        function selectCategory(cat) {
            activeCategory = cat;
            document.getElementById('stage-title-cat').innerText = cat.toUpperCase();
            showStagesList();
        }

        function getUnlockedStage(cat) {
            return parseInt(localStorage.getItem(`maxStage_${cat}`)) || 1;
        }

        function showStagesList() {
            hideAll(); stageScreen.classList.remove('hidden');
            const grid = document.getElementById('stages-grid');
            grid.innerHTML = '';
            
            const maxUnlocked = getUnlockedStage(activeCategory);
            const data = gameCategories[activeCategory];

            data.forEach((level, index) => {
                const card = document.createElement('div');
                card.className = 'stage-card';
                
                const isCompleted = localStorage.getItem(`stage_${activeCategory}_${level.stage}_done`) === "true";
                const isUnlocked = level.stage <= maxUnlocked;

                if (isCompleted) {
                    card.classList.add('completed');
                    card.innerHTML = `<div class="stage-num">${level.stage}</div><i class="fa-solid fa-check"></i>`;
                } else if (isUnlocked) {
                    card.classList.add('unlocked');
                    card.innerHTML = `<div class="stage-num">${level.stage}</div>`;
                } else {
                    card.classList.add('locked');
                    card.innerHTML = `<div class="stage-num"><i class="fa-solid fa-lock"></i></div>`;
                }

                if (isUnlocked) card.onclick = () => launchGame(index);
                grid.appendChild(card);
            });
        }

        function launchGame(index) {
            currentStageIndex = index;
            hideAll(); gameScreen.classList.remove('hidden');
            
            if (!musicPlaying) toggleMusic();

            const level = gameCategories[activeCategory][index];
            document.getElementById('game-stage-title').innerText = `Niveau ${level.stage}`;
            document.getElementById('logo-image').src = level.logo;
            document.getElementById('answer-input').value = '';
            document.getElementById('logo-frame').classList.remove('success-glow', 'shake');
            
            if (!checkCooldown()) {
                attemptsLeft = 3;
                updateAttemptsUI();
                enableInputs();
                document.getElementById('feedback').innerText = '';
                document.getElementById('answer-input').focus();
            }
        }

        function updateAttemptsUI() {
            const container = document.getElementById('attempts-container');
            container.innerHTML = '';
            for (let i = 1; i <= 3; i++) {
                const heart = document.createElement('i');
                heart.className = i <= attemptsLeft ? 'fa-solid fa-heart heart-icon' : 'fa-solid fa-heart heart-icon lost';
                container.appendChild(heart);
            }
        }

        function disableInputs() {
            document.getElementById('answer-input').disabled = true;
            document.getElementById('validate-btn').disabled = true;
        }

        function enableInputs() {
            document.getElementById('answer-input').disabled = false;
            document.getElementById('validate-btn').disabled = false;
        }

        function checkCooldown() {
            const cooldownEnd = localStorage.getItem(`cooldown_${activeCategory}`);
            if (cooldownEnd) {
                const timeLeft = parseInt(cooldownEnd) - Date.now();
                if (timeLeft > 0) {
                    startCooldownTimer();
                    return true;
                } else {
                    localStorage.removeItem(`cooldown_${activeCategory}`);
                }
            }
            return false;
        }

        function startCooldownTimer() {
            clearInterval(cooldownInterval);
            disableInputs();
            attemptsLeft = 0; updateAttemptsUI();
            const feedback = document.getElementById('feedback');

            function updateTimer() {
                const end = localStorage.getItem(`cooldown_${activeCategory}`);
                if (!end) return endCooldown();
                
                const remaining = parseInt(end) - Date.now();
                if (remaining <= 0) {
                    endCooldown();
                } else {
                    const m = Math.floor(remaining / 60000);
                    const s = Math.floor((remaining % 60000) / 1000);
                    feedback.style.color = 'var(--error)';
                    feedback.innerHTML = `Bloqué ! Reviens dans ${m}:${s < 10 ? '0'+s : s}`;
                }
            }
            updateTimer();
            cooldownInterval = setInterval(updateTimer, 1000);
        }

        function endCooldown() {
            clearInterval(cooldownInterval);
            localStorage.removeItem(`cooldown_${activeCategory}`);
            attemptsLeft = 3; updateAttemptsUI(); enableInputs();
            document.getElementById('feedback').innerText = 'Vies rechargées !';
            document.getElementById('feedback').style.color = 'var(--primary-light)';
        }

        function normalizeString(str) {
            return str.toLowerCase().replace(/[^a-z0-9]/g, '');
        }

        function checkAnswer() {
            if (localStorage.getItem(`cooldown_${activeCategory}`)) return;

            const currentLevel = gameCategories[activeCategory][currentStageIndex];
            const userAnswerRaw = document.getElementById('answer-input').value;
            const userAnswer = normalizeString(userAnswerRaw);
            const correctAnswer = normalizeString(currentLevel.answer);
            const frame = document.getElementById('logo-frame');
            const feedback = document.getElementById('feedback');

            frame.classList.remove('shake', 'success-glow');

            if (userAnswer === correctAnswer) {
                feedback.style.color = 'var(--success)';
                feedback.innerText = 'Correct !';
                frame.classList.add('success-glow');

                localStorage.setItem(`stage_${activeCategory}_${currentLevel.stage}_done`, "true");
                const currentMax = getUnlockedStage(activeCategory);
                if (currentLevel.stage >= currentMax && currentLevel.stage < 20) {
                    localStorage.setItem(`maxStage_${activeCategory}`, currentLevel.stage + 1);
                }

                setTimeout(() => {
                    if (currentStageIndex + 1 < gameCategories[activeCategory].length) {
                        launchGame(currentStageIndex + 1);
                    } else {
                        alert('Félicitations, vous avez terminé cette catégorie !');
                        showStagesList();
                    }
                }, 1000);

            } else {
                attemptsLeft--;
                updateAttemptsUI();
                frame.classList.add('shake');

                if (attemptsLeft <= 0) {
                    const cooldownTime = Date.now() + 5 * 60 * 1000;
                    localStorage.setItem(`cooldown_${activeCategory}`, cooldownTime);
                    startCooldownTimer();
                } else {
                    feedback.style.color = 'var(--error)';
                    feedback.innerText = `Faux ! ${attemptsLeft} essai(s) restant(s).`;
                }
                setTimeout(() => frame.classList.remove('shake'), 400);
            }
        }

        document.getElementById('answer-input').addEventListener("keypress", function(e) {
            if (e.key === "Enter") { e.preventDefault(); checkAnswer(); }
        });

        function toggleMusic() {
            if (musicPlaying) {
                bgMusic.pause();
                musicBtn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
                musicBtn.style.background = 'rgba(139, 92, 255, 0.1)';
            } else {
                bgMusic.volume = 0.3;
                bgMusic.play().catch(e => console.log("Clic requis pour l'audio"));
                musicBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
                musicBtn.style.background = 'var(--primary)';
                musicBtn.style.color = 'var(--text-main)';
            }
            musicPlaying = !musicPlaying;
        }
    </script>
</body>
</html>
